<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Admin — Vista Rio Café</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { terracota: '#B45F3E', marrom: '#4B342A', bege: '#EFE0CE', creme: '#FBF6EF', areia: '#D9C2A7' }, fontFamily: { sans: ['Inter', 'sans-serif'] } } }
    };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body class="bg-creme text-marrom font-sans p-6 min-h-screen">

  <div id="login-screen" class="max-w-sm mx-auto mt-20 bg-white p-8 rounded-2xl shadow-xl border border-areia/50">
    <div class="text-center mb-6">
      <div class="w-12 h-12 bg-marrom text-creme rounded-full flex items-center justify-center font-serif text-2xl mx-auto mb-3">V</div>
      <h1 class="text-2xl font-bold">Acesso Restrito</h1>
      <p class="text-sm text-marrom/60 mt-1">Gerencie o cardápio do Vista Rio</p>
    </div>
    <input type="password" id="admin-pass" placeholder="Digite a senha (admin)" class="w-full border border-areia p-3 rounded-lg mb-4 focus:outline-none focus:border-terracota bg-creme/30" />
    <button onclick="login()" class="w-full bg-marrom text-white p-3 rounded-lg hover:bg-terracota transition font-medium">Entrar no Painel</button>
    <p id="login-error" class="text-red-500 text-sm mt-2 hidden text-center font-medium">Senha incorreta. Tente novamente.</p>
    <div class="mt-6 text-center">
      <a href="index.html" class="text-sm text-marrom/50 hover:text-terracota transition-colors">← Voltar para o site</a>
    </div>
  </div>

  <div id="dashboard" class="hidden max-w-6xl mx-auto">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4">
      <div>
        <h1 class="text-3xl font-bold font-serif">Gestão de Cardápio</h1>
        <p class="text-sm text-marrom/60 mt-1">Adicione, edite ou remova produtos do site.</p>
      </div>
      <div class="flex gap-3 w-full sm:w-auto">
        <button onclick="exportData()" class="flex-1 sm:flex-none bg-white border border-areia text-marrom px-4 py-2 rounded-lg font-medium hover:bg-bege transition shadow-sm text-sm">Baixar JSON</button>
        <a href="index.html" class="flex-1 sm:flex-none text-center bg-terracota text-white px-4 py-2 rounded-lg font-medium hover:bg-terracota-dark transition shadow-sm text-sm">Ver Site</a>
      </div>
    </div>

    <div class="grid md:grid-cols-3 gap-6">
      <div class="bg-white p-6 rounded-2xl shadow-sm h-fit sticky top-6 border border-areia/50">
        <h2 class="text-xl font-bold mb-4 font-serif" id="form-title">Novo Produto</h2>
        <form id="product-form" class="space-y-3">
          <input type="hidden" id="prod-id" />
          <div>
            <label class="text-xs font-semibold text-marrom/80">Nome do Produto</label>
            <input type="text" id="prod-name" required class="w-full border border-areia p-2.5 rounded text-sm focus:border-terracota outline-none" />
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-xs font-semibold text-marrom/80">Preço (R$)</label>
              <input type="number" step="0.01" id="prod-price" required class="w-full border border-areia p-2.5 rounded text-sm focus:border-terracota outline-none" />
            </div>
            <div>
              <label class="text-xs font-semibold text-marrom/80">Categoria</label>
              <select id="prod-cat" required class="w-full border border-areia p-2.5 rounded text-sm bg-white focus:border-terracota outline-none"></select>
            </div>
          </div>
          <div>
            <label class="text-xs font-semibold text-marrom/80">Descrição</label>
            <textarea id="prod-desc" required class="w-full border border-areia p-2.5 rounded text-sm h-20 focus:border-terracota outline-none"></textarea>
          </div>
          <div>
            <label class="text-xs font-semibold text-marrom/80">Caminho da Imagem</label>
            <input type="text" id="prod-img" required placeholder="assets/img/nome.jpeg" class="w-full border border-areia p-2.5 rounded text-sm focus:border-terracota outline-none" />
            <p class="text-[10px] text-marrom/50 mt-1">Ex: assets/img/tapioca_cabocla.jpeg</p>
          </div>
          <div>
            <label class="text-xs font-semibold block mb-1 text-marrom/80">Unidades Disponíveis</label>
            <label class="flex items-center gap-2 text-sm"><input type="checkbox" value="ponta-negra" class="prod-unit accent-terracota" checked /> Ponta Negra</label>
            <label class="flex items-center gap-2 text-sm"><input type="checkbox" value="mirante" class="prod-unit accent-terracota" checked /> Mirante</label>
          </div>
          <div class="flex gap-2 pt-3 border-t border-areia/50 mt-2">
            <button type="submit" class="flex-1 bg-terracota text-white p-2.5 rounded-lg hover:bg-terracota-dark transition text-sm font-medium shadow-sm">Salvar</button>
            <button type="button" onclick="resetForm()" class="bg-gray-100 text-gray-600 px-4 rounded-lg text-sm hover:bg-gray-200 transition">Limpar</button>
          </div>
        </form>
      </div>

      <div class="md:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-areia/50">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-xl font-bold font-serif">Itens Cadastrados</h2>
          <span id="count-items" class="bg-bege text-marrom text-xs font-bold px-3 py-1 rounded-full">0 itens</span>
        </div>
        <div id="admin-list" class="space-y-3"></div>
      </div>
    </div>
  </div>

  <script>
    const ADMIN_PASS = 'admin';
    let currentData = null;

    function login() {
      const pass = document.getElementById('admin-pass').value;
      if (pass === ADMIN_PASS) {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        loadData();
      } else {
        document.getElementById('login-error').classList.remove('hidden');
      }
    }

    async function loadData() {
      const local = localStorage.getItem('vrc_admin_data');
      if (local) {
        currentData = JSON.parse(local);
      } else {
        try {
          const res = await fetch('data/products.json');
          currentData = await res.json();
        } catch(e) {
          alert("Erro ao carregar JSON. Certifique-se de estar rodando num servidor local (ex: python -m http.server).");
          return;
        }
      }
      renderAdminList();
      populateCategories();
    }

    function populateCategories() {
      const select = document.getElementById('prod-cat');
      select.innerHTML = currentData.categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
    }

    function renderAdminList() {
      const list = document.getElementById('admin-list');
      document.getElementById('count-items').textContent = currentData.products.length + " itens";
      
      if (currentData.products.length === 0) {
        list.innerHTML = `<p class="text-sm text-marrom/50 text-center py-4">Nenhum produto cadastrado.</p>`;
        return;
      }

      list.innerHTML = currentData.products.map(p => `
        <div class="flex justify-between items-center p-3 border border-areia/40 rounded-xl hover:bg-creme transition group">
          <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-lg bg-bege overflow-hidden shrink-0">
              <img src="${p.image}" class="w-full h-full object-cover" onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=\\'w-full h-full flex items-center justify-center text-marrom/30 text-xs\\'>IMG</div>';">
            </div>
            <div>
              <p class="font-semibold text-sm text-marrom">${p.name}</p>
              <div class="flex gap-2 items-center mt-0.5">
                <span class="text-xs text-terracota font-bold bg-terracota/10 px-2 py-0.5 rounded">R$ ${p.price.toFixed(2).replace('.', ',')}</span>
                <span class="text-[10px] text-marrom/50 uppercase tracking-wider">${p.category}</span>
              </div>
            </div>
          </div>
          <div class="flex gap-1 opacity-100 group-hover:opacity-100 transition-opacity">
            <button onclick="editProduct('${p.id}')" class="text-blue-600 hover:bg-blue-50 p-2 rounded-lg transition" title="Editar">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
            </button>
            <button onclick="deleteProduct('${p.id}')" class="text-red-500 hover:bg-red-50 p-2 rounded-lg transition" title="Excluir">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
            </button>
          </div>
        </div>
      `).join('');
    }

    document.getElementById('product-form').onsubmit = (e) => {
      e.preventDefault();
      const id = document.getElementById('prod-id').value || 'prod-' + Date.now();
      const units = Array.from(document.querySelectorAll('.prod-unit:checked')).map(cb => cb.value);
      
      const newProd = {
        id,
        name: document.getElementById('prod-name').value,
        price: parseFloat(document.getElementById('prod-price').value),
        description: document.getElementById('prod-desc').value,
        image: document.getElementById('prod-img').value,
        category: document.getElementById('prod-cat').value,
        units: units,
        options: {} 
      };

      const index = currentData.products.findIndex(p => p.id === id);
      if (index >= 0) {
        newProd.options = currentData.products[index].options || {};
        currentData.products[index] = newProd;
      } else {
        currentData.products.push(newProd);
      }

      saveToLocal();
      resetForm();
    };

    function editProduct(id) {
      const p = currentData.products.find(p => p.id === id);
      if (!p) return;

      document.getElementById('form-title').textContent = 'Editar Produto';
      document.getElementById('prod-id').value = p.id;
      document.getElementById('prod-name').value = p.name;
      document.getElementById('prod-price').value = p.price;
      document.getElementById('prod-desc').value = p.description;
      document.getElementById('prod-img').value = p.image;
      document.getElementById('prod-cat').value = p.category;
      
      document.querySelectorAll('.prod-unit').forEach(cb => {
        cb.checked = p.units.includes(cb.value);
      });
      
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteProduct(id) {
      if (!confirm('Tem certeza que deseja excluir este produto?')) return;
      currentData.products = currentData.products.filter(p => p.id !== id);
      saveToLocal();
    }

    function saveToLocal() {
      localStorage.setItem('vrc_admin_data', JSON.stringify(currentData));
      renderAdminList();
    }

    function resetForm() {
      document.getElementById('product-form').reset();
      document.getElementById('prod-id').value = '';
      document.getElementById('form-title').textContent = 'Novo Produto';
      document.querySelectorAll('.prod-unit').forEach(cb => cb.checked = true);
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(currentData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'products.json';
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
